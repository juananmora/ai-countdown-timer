<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Countdown Timer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Roboto+Mono:wght@700&family=Orbitron:wght@600;800&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; }
      .font-orbitron { font-family: 'Orbitron', 'Inter', sans-serif; letter-spacing: 0.08em; }
      .font-space { font-family: 'Space Grotesk', 'Inter', sans-serif; }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fadeIn 0.5s ease-out forwards;
      }

      @keyframes tick {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-tick {
        animation: tick 0.5s ease-out forwards;
      }
      
      @keyframes panGrid {
        0% { background-position: 0% 0%; }
        100% { background-position: 100px 100px; }
      }
      
      .animated-grid-background {
        background-color: #020617; /* slate-950 */
        background-image: 
          radial-gradient(circle at center, rgba(45, 2, 99, 0.4) 0%, transparent 40%),
          linear-gradient(to right, #0a0e23 1px, transparent 1px),
          linear-gradient(to bottom, #0a0e23 1px, transparent 1px);
        background-size: 100% 100%, 50px 50px, 50px 50px;
        animation: panGrid 15s linear infinite;
      }
    </style>
